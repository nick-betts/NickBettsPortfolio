<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nick Betts | Portfolio</title>
    <meta
      name="description"
      content="Nick Betts is a product and UX designer. Explore three case studies across healthcare, e-commerce, and operations."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="cursor-mark" aria-hidden="true"></div>
    <div class="page">
      <header class="topbar">
        <nav class="nav" aria-label="Primary navigation">
          <a class="brand" href="/">Nick Betts</a>
          <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav-links" aria-label="Open navigation">
            <span class="nav-toggle-lines"><span></span></span>
          </button>
          <div class="nav-links" id="primary-nav-links">
            <a class="is-active" href="/#work">Work</a>
            <a href="/about">About</a>
            <a href="Nick_Betts_Resume.pdf" target="_blank" rel="noreferrer">Resume</a>
          </div>
        </nav>
        <p class="orientation">
          Implementation Specialist @ Walker | B.S. UX Design, Purdue University | Based in Indy
        </p>
      </header>

      <main id="top">
        <section id="work" class="work-list" aria-label="Case studies">
          <article
            class="project-row"
            tabindex="0"
            role="link"
            data-href="/appliq"
            data-rotation="-2deg"
            data-thumb-title="Atlas Health dashboard preview"
            data-thumb-svg="atlas"
            data-thumb-meta="ApplIQ"
            data-thumb-copy="An AI-powered platform that helps job seekers tailor resumes to specific roles with transparent, actionable feedback."
          >
            <span class="project-index" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 3.5h7l4 4V20.5H7z"></path>
                <path d="M14 3.5v4h4"></path>
                <path d="M10 12h5"></path>
                <path d="M10 15.5h5"></path>
              </svg>
            </span>
            <div class="project-main">
              <h2 class="project-title">ApplIQ</h2>
            </div>
            <p class="project-category">AI Career Tool</p>
            <a class="project-link" href="/appliq" aria-label="View ApplIQ case study"><span aria-hidden="true">↗</span></a>
          </article>

          <article
            class="project-row"
            tabindex="0"
            role="link"
            data-href="/wisq"
            data-rotation="1.5deg"
            data-thumb-title="Wisq voice and tone preview"
            data-thumb-svg="wisq"
            data-thumb-meta="Wisq"
            data-thumb-copy="Leveraging GPT-4o’s capabilities for real-time virtual meeting coaching."
          >
            <span class="project-index" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3.5" y="5" width="17" height="11" rx="2.5"></rect>
                <path d="M8 20.5h8"></path>
                <path d="M12 16v4.5"></path>
                <path d="M9 9.5v2.5"></path>
                <path d="M12 8v5"></path>
                <path d="M15 10.5v1.5"></path>
              </svg>
            </span>
            <div class="project-main">
              <h2 class="project-title">Wisq</h2>
            </div>
            <p class="project-category">AI Meeting Coach</p>
            <a class="project-link" href="/wisq" aria-label="View Wisq case study"><span aria-hidden="true">↗</span></a>
          </article>

          <article
            class="project-row"
            tabindex="0"
            role="link"
            data-href="/imleagues"
            data-rotation="-1deg"
            data-thumb-title="Northstar Field Ops mobile workflow preview"
            data-thumb-svg="northstar"
            data-thumb-meta="IMLeagues"
            data-thumb-copy="Redesigning the current IMLeagues website to improve intramural sports experience."
          >
            <span class="project-index" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <line x1="12" y1="3" x2="12" y2="21"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <path d="M7 4C9 7 9 17 7 20"></path>
                <path d="M17 4C15 7 15 17 17 20"></path>
              </svg>
            </span>
            <div class="project-main">
              <h2 class="project-title">IMLeagues</h2>
            </div>
            <p class="project-category">Website Redesign</p>
            <a class="project-link" href="/imleagues" aria-label="View IMLeagues case study"><span aria-hidden="true">↗</span></a>
          </article>
        </section>
      </main>

      <footer class="footer">
        <p class="footer-left">
          © 2026 Nick Betts ·
          <a href="mailto:nickbetts317@gmail.com">nickbetts317@gmail.com</a> ·
          <a href="https://www.linkedin.com/in/nickbetts1/" target="_blank" rel="noreferrer">LinkedIn</a>
        </p>
        <p class="footer-right">Let's work together :)</p>
      </footer>
    </div>

    <template id="thumb-atlas">
      <img src="appliq_thumbnail.png" alt="ApplIQ project thumbnail" />

    <template id="thumb-wisq">
      <img src="wisqthumbnail.png" alt="Wisq project thumbnail" />
    </template>

    <aside class="hover-thumb" aria-hidden="true">
      <div class="hover-thumb-frame"></div>
      <div class="hover-thumb-copy">
        <p class="hover-thumb-meta"></p>
        <p class="hover-thumb-text"></p>
      </div>
    </aside>

    <script src="script.js"></script>
  </body>
</html>
