<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nick Betts | Portfolio</title>
    <meta
      name="description"
      content="Nick Betts is a product and UX designer. Explore three case studies across healthcare, e-commerce, and operations."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body>
    <div class="cursor-mark" aria-hidden="true"></div>

      <header class="topbar">

          <a class="brand" href="#top">Nick Betts</a>

      <main id="top">

          <article
            class="project-row"
            tabindex="0"
            role="link"
            data-href="appliq.html"
            data-rotation="-2deg"

            <a class="project-link" href="appliq.html" aria-label="View ApplIQ case study"><span aria-hidden="true">↗</span></a>
          </article>

          <article
            class="project-row"
            tabindex="0"
            role="link"
            data-href="wisq.html"
            data-rotation="1.5deg"
            data-thumb-title="Signal Commerce checkout preview"
            data-thumb-svg="signal"
            data-thumb-meta="Wisq"
            data-thumb-copy="Leveraging GPT-4o’s capabilities for real-time virtual meeting coaching."

            <span class="project-index">02</span>
            <div class="project-main">
              <h2 class="project-title">Wisq</h2>
            </div>
            <p class="project-category">AI Meeting Coach</p>
            <a class="project-link" href="wisq.html" aria-label="View Wisq case study"><span aria-hidden="true">↗</span></a>
          </article>

            class="project-row"
            tabindex="0"
            role="link"

            <span class="project-index">03</span>
            <div class="project-main">
              <h2 class="project-title">IMLeagues</h2>
            </div>
            <p class="project-category">Website Redesign</p>
            <a class="project-link" href="imleagues.html" aria-label="View IMLeagues case study"><span aria-hidden="true">↗</span></a>

      <footer class="footer">

          <a href="mailto:nickbetts317@gmail.com">nickbetts317@gmail.com</a> ·
          <a href="https://www.linkedin.com/in/nickbetts1/" target="_blank" rel="noreferrer">LinkedIn</a>

        <p class="footer-right">Let's work together :)</p>
